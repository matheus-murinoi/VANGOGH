org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC
org.gradle.workers.max=1
org.gradle.parallel=false
# Compila Kotlin dentro do próprio daemon do Gradle. O daemon separado subiria
# uma segunda JVM de 2G e, somada ao heap do Gradle, estoura a memória da máquina.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
